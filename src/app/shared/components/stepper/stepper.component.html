<div class="stepper-wrapper">
  @for (label of steps; track $index; let i = $index; let last = $last) {
    <div
      class="step-item"
      [class.step-completed]="getStatus(i) === 'completed'"
      [class.step-active]="getStatus(i) === 'active'"
      [class.step-pending]="getStatus(i) === 'pending'"
    >
      <div class="step-indicator">
        @if (getStatus(i) === 'completed') {
          <i class="bi bi-check-lg"></i>
        } @else {
          <span class="step-number">{{ i + 1 }}</span>
        }
      </div>
      <span class="step-label">{{ label }}</span>
    </div>

    @if (!last) {
      <div class="step-line" [class.line-completed]="getStatus(i) === 'completed'"></div>
    }
  }
</div>
