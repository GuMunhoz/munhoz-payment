@if (isMockEnabled) {
  <div class="simulator-container">
    <!-- Floating trigger button -->
    <button
      type="button"
      class="simulator-trigger shadow"
      [ngClass]="getModeBadgeClass()"
      (click)="toggleOpen()"
      aria-label="Abrir Simulador de Cenários"
    >
      <i class="bi bi-sliders2 me-1"></i>
      <span class="d-none d-sm-inline me-1">Simulador:</span>
      <strong>{{ getModeBadgeLabel() }}</strong>
    </button>

    <!-- Panel popup / modal -->
    @if (isOpen()) {
      <div class="simulator-backdrop" (click)="toggleOpen()"></div>
      <div class="simulator-popover card shadow-lg animate-pop">
        <div class="card-header d-flex justify-content-between align-items-center py-2 px-3 bg-white">
          <div class="d-flex align-items-center">
            <i class="bi bi-cpu text-primary me-2 fs-5"></i>
            <span class="fw-semibold">Simulador de Pagamento</span>
          </div>
          <button type="button" class="btn-close btn-sm" (click)="toggleOpen()" aria-label="Fechar"></button>
        </div>

        <div class="card-body p-3">
          <p class="text-muted small mb-3">
            Selecione o resultado que o pagamento (Cartão ou Pix) terá ao ser enviado:
          </p>

          <!-- Mode selector buttons -->
          <div class="btn-group w-100 mb-3" role="group">
            <button
              type="button"
              class="btn btn-sm"
              [ngClass]="state().mode === 'success' ? 'btn-success text-white' : 'btn-outline-secondary'"
              (click)="setMode('success')"
            >
              <i class="bi bi-check-circle-fill me-1"></i> Sucesso
            </button>
            <button
              type="button"
              class="btn btn-sm"
              [ngClass]="state().mode === 'error' ? 'btn-danger text-white' : 'btn-outline-secondary'"
              (click)="setMode('error')"
            >
              <i class="bi bi-x-circle-fill me-1"></i> Erro
            </button>
            <button
              type="button"
              class="btn btn-sm"
              [ngClass]="state().mode === 'random' ? 'btn-primary text-white' : 'btn-outline-secondary'"
              (click)="setMode('random')"
            >
              <i class="bi bi-shuffle me-1"></i> Aleatório
            </button>
          </div>

          <!-- Error reason selector (if mode === 'error') -->
          @if (state().mode === 'error') {
            <div class="error-reason-box p-2 mb-3 rounded border">
              <label class="form-label text-muted small fw-semibold mb-2">Motivo da falha simulada:</label>
              <div class="d-flex flex-column gap-1">
                <div class="form-check small">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="err-declined"
                    name="errorReason"
                    [checked]="state().errorReason === 'declined'"
                    (change)="setErrorReason('declined')"
                  />
                  <label class="form-check-label" for="err-declined">
                    <strong>Cartão não autorizado</strong> (recusado pelo banco)
                  </label>
                </div>
                <div class="form-check small">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="err-funds"
                    name="errorReason"
                    [checked]="state().errorReason === 'insufficient_funds'"
                    (change)="setErrorReason('insufficient_funds')"
                  />
                  <label class="form-check-label" for="err-funds">
                    <strong>Saldo insuficiente</strong>
                  </label>
                </div>
                <div class="form-check small">
                  <input
                    class="form-check-input"
                    type="radio"
                    id="err-timeout"
                    name="errorReason"
                    [checked]="state().errorReason === 'timeout'"
                    (change)="setErrorReason('timeout')"
                  />
                  <label class="form-check-label" for="err-timeout">
                    <strong>Falha de comunicação</strong> (timeout)
                  </label>
                </div>
              </div>
            </div>
          }

          <hr class="my-2" />

          <div class="d-flex justify-content-between align-items-center pt-1">
            <button type="button" class="btn btn-outline-danger btn-sm" (click)="resetAll()">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Reiniciar fluxo
            </button>
            <button type="button" class="btn btn-secondary btn-sm" (click)="toggleOpen()">
              Concluído
            </button>
          </div>
        </div>
      </div>
    }
  </div>
}
