<div class="home-container">
  <div class="card banner-card text-center p-4 p-md-5">
    <div class="badge-nexo mx-auto mb-3">
      <i class="bi bi-stars me-1"></i> Nexo Pro
    </div>
    <h1 class="display-6 fw-bold mb-3">Eleve o nível do seu negócio</h1>
    <p class="text-muted mx-auto mb-4 banner-desc">
      Acesso completo à plataforma, relatórios inteligentes e automações sem limites por apenas <strong>R$ 79,90/mês</strong>.
    </p>

    <div class="d-flex justify-content-center">
      <button
        type="button"
        class="btn btn-primary btn-lg px-5 py-3 fw-semibold shadow-sm d-flex align-items-center gap-2 banner-btn"
        (click)="goToPayment()"
      >
        <i class="bi bi-shield-check fs-5"></i>
        <span>Efetuar pagamento</span>
      </button>
    </div>

    <div class="d-flex justify-content-center align-items-center gap-3 text-muted small mt-4">
      <span><i class="bi bi-credit-card me-1"></i> Cartão de Crédito ou Débito</span>
      <span>•</span>
      <span><i class="bi bi-suit-diamond me-1"></i> Pix com aprovação imediata</span>
    </div>
  </div>
</div>
